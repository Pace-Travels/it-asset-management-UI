<app-page-header title="Add Email Account" subtitle="Add New Email Account Information" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="emailAccountForm">

        <!-- Account Details -->
        <div class="form-section">

            <h3 class="form-section-title">
                Email Account Details
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Email Code
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="emailCode">
                    <app-validation-message [control]="emailAccountForm.controls['emailCode']" label="Email Code">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Email Address
                        <span class="required">*</span>
                    </label>
                    <input type="email" formControlName="emailAddress">
                    <app-validation-message [control]="emailAccountForm.controls['emailAddress']" label="Email Address">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Employee
                        <span class="required">*</span>
                    </label>
                    <select formControlName="employeeId">
                        <option [ngValue]="null">Select Employee</option>
                        <option *ngFor="let emp of employees" [value]="emp.id">
                            {{ emp.firstName }} {{ emp.lastName }} ({{ emp.employeeCode }})
                        </option>
                    </select>
                    <app-validation-message [control]="emailAccountForm.controls['employeeId']" label="Employee">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Provider
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="provider">
                    <app-validation-message [control]="emailAccountForm.controls['provider']" label="Provider">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Status
                        <span class="required">*</span>
                    </label>
                    <select formControlName="statusId">
                        <option [ngValue]="null">Select Status</option>
                        <option *ngFor="let st of statuses" [value]="st.id">
                            {{ st.statusName }}
                        </option>
                    </select>
                    <app-validation-message [control]="emailAccountForm.controls['statusId']" label="Status">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Is Active
                        <span class="required">*</span>
                    </label>
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                    <app-validation-message [control]="emailAccountForm.controls['isActive']" label="Is Active">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Renewal Details -->
        <div class="form-section">

            <h3 class="form-section-title">
                Renewal Information
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Renewal Date
                    </label>
                    <input type="date" formControlName="renewalDate">
                    <app-validation-message [control]="emailAccountForm.controls['renewalDate']" label="Renewal Date">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Renewal Cost
                    </label>
                    <input type="number" step="0.01" formControlName="renewalCost">
                    <app-validation-message [control]="emailAccountForm.controls['renewalCost']" label="Renewal Cost">
                    </app-validation-message>
                </div>

                <div class="form-group full-width">
                    <label>
                        Remarks
                    </label>
                    <input type="text" formControlName="remarks">
                    <app-validation-message [control]="emailAccountForm.controls['remarks']" label="Remarks">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Actions -->
        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">
                Cancel
            </button>
            <button type="submit" class="primary-btn" [disabled]="emailAccountForm.invalid" (click)="save()">
                Save Email Account
            </button>

        </div>

    </form>

</div>
