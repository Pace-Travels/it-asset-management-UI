<app-page-header title="Subscription Reminder Type" buttonText="Add Subscription Reminder Type" (buttonClick)="addSubsReminderType()">
</app-page-header>

<app-table-toolbar (search)="searchSubsReminderType($event)" (add)="addSubsReminderType()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Subscription Reminder Type Name</th>

                <th>Subscription Reminder Type Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(subsReminderType of tableData; track subsReminderType.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{subsReminderType.name}}</td>

                <td>{{subsReminderType.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editSubsReminderType(subsReminderType.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(subsReminderType)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Subscription Reminder Type'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedSubsReminderType?.name"
    [itemCode]="selectedSubsReminderType?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteSubsReminderType()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
