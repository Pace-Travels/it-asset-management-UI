<app-page-header title="Edit Domain/Website" subtitle="Update Domain or Website Information" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="domainForm">

        <!-- General Domain Information -->
        <div class="form-section">

            <h3 class="form-section-title">
                Domain Details
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Domain Code
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="domainCode">
                    <app-validation-message [control]="domainForm.controls['domainCode']" label="Domain Code">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Domain Name
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="domainName">
                    <app-validation-message [control]="domainForm.controls['domainName']" label="Domain Name">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Website URL
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="websiteUrl">
                    <app-validation-message [control]="domainForm.controls['websiteUrl']" label="Website URL">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Hosting Provider
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="hostingProvider">
                    <app-validation-message [control]="domainForm.controls['hostingProvider']" label="Hosting Provider">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Server
                        <span class="required">*</span>
                    </label>
                    <select formControlName="serverId">
                        <option [ngValue]="null">Select Server</option>
                        <option *ngFor="let server of servers" [value]="server.id">
                            {{ server.serverName }}
                        </option>
                    </select>
                    <app-validation-message [control]="domainForm.controls['serverId']" label="Server">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Status
                        <span class="required">*</span>
                    </label>
                    <select formControlName="statusId">
                        <option [ngValue]="null">Select Status</option>
                        <option *ngFor="let status of statuses" [value]="status.id">
                            {{ status.name }}
                        </option>
                    </select>
                    <app-validation-message [control]="domainForm.controls['statusId']" label="Status">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Vendor
                    </label>
                    <select formControlName="vendorId">
                        <option [ngValue]="null">Select Vendor</option>
                        <option *ngFor="let vendor of vendors" [value]="vendor.id">
                            {{ vendor.vendorName }}
                        </option>
                    </select>
                    <app-validation-message [control]="domainForm.controls['vendorId']" label="Vendor">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Dates & Financial Information -->
        <div class="form-section">

            <h3 class="form-section-title">
                Subscription & Pricing
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Purchase Date
                        <span class="required">*</span>
                    </label>
                    <input type="date" formControlName="purchaseDate">
                    <app-validation-message [control]="domainForm.controls['purchaseDate']" label="Purchase Date">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Expiry Date
                        <span class="required">*</span>
                    </label>
                    <input type="date" formControlName="expiryDate">
                    <app-validation-message [control]="domainForm.controls['expiryDate']" label="Expiry Date">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Renewal Date
                    </label>
                    <input type="date" formControlName="renewalDate">
                    <app-validation-message [control]="domainForm.controls['renewalDate']" label="Renewal Date">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Renewal Cost
                    </label>
                    <input type="number" step="0.01" formControlName="renewalCost">
                    <app-validation-message [control]="domainForm.controls['renewalCost']" label="Renewal Cost">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Active Status
                        <span class="required">*</span>
                    </label>
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                    <app-validation-message [control]="domainForm.controls['isActive']" label="Active Status">
                    </app-validation-message>
                </div>

                <div class="form-group full-width">
                    <label>
                        Remarks
                    </label>
                    <input type="text" formControlName="remarks">
                    <app-validation-message [control]="domainForm.controls['remarks']" label="Remarks">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Form Actions -->
        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">
                Cancel
            </button>
            <button type="submit" class="primary-btn" [disabled]="domainForm.invalid" (click)="update()">
                Update Domain
            </button>

        </div>

    </form>

</div>
