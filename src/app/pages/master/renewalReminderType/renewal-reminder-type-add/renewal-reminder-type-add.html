<app-page-header title="Add Renewal Reminder Type" subtitle="Create New Renewal Reminder Type" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="renewalRemTypeForm">
        <div class="form-grid-2">
            <div class="form-group">

                <label>Renewal Reminder Type Name<span class="required">*</span></label>

                <input type="text" formControlName="name">
                <app-validation-message [control]="renewalRemTypeForm.controls['name']"
                    label="Asset Name"></app-validation-message>
            </div>
        </div>
        <div class="form-grid-1">
            <div class="form-group">

                <label>Renewal Reminder Type Description</label>

                <textarea formControlName="description"></textarea>
            </div>
        </div>

        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">

                Cancel

            </button>

            <button type="submit" class="primary-btn" [disabled]="renewalRemTypeForm.invalid" (click)="save()">

                Save Renewal Reminder Type

            </button>

        </div>

    </form>

</div>
