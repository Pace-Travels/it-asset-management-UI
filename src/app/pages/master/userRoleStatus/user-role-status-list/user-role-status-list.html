<app-page-header title="User Role Status" buttonText="Add User Role Status" (buttonClick)="addUserRoleStatus()">
</app-page-header>

<app-table-toolbar (search)="searchUserRoleStatus($event)" (add)="addUserRoleStatus()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>User Role Status Name</th>

                <th>User Role Status Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(userRoleStatus of tableData; track userRoleStatus.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{userRoleStatus.name}}</td>

                <td>{{userRoleStatus.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editUserRoleStatus(userRoleStatus.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(userRoleStatus)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete User Role Status'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedUserRoleStatus?.name"
    [itemCode]="selectedUserRoleStatus?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteUserRoleStatus()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
