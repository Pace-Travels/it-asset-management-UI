<app-page-header title="Server Management Category" buttonText="Add Server Management Category" (buttonClick)="addserveMangCate()">
</app-page-header>

<app-table-toolbar (search)="searchserveMangCate($event)" (add)="addserveMangCate()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Server Management Category Name</th>

                <th>Server Management Category Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(serveMangCate of tableData; track serveMangCate.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{serveMangCate.name}}</td>

                <td>{{serveMangCate.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" title="Edit" (click)="editserveMangCateStatus(serveMangCate.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(serveMangCate)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Server Management Category'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedServeMangCate?.name"
    [itemCode]="selectedServeMangCate?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteServeMangCate()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
