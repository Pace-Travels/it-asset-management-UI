<app-page-header title="Permission" buttonText="Add Permission" (buttonClick)="addPermission()">
</app-page-header>

<app-table-toolbar (search)="searchPermission($event)" (add)="addPermission()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Permission Name</th>

                <th>Permission Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(permi of tableData; track permi.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{permi.name}}</td>

                <td>{{permi.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editPermission(permi.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(permi)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Permission'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedPermission?.name"
    [itemCode]="selectedPermission?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deletePermission()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
