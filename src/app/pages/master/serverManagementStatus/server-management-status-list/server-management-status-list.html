<app-page-header title="Server Management Status" buttonText="Server Management Status" (buttonClick)="addServerMangStatus()">
</app-page-header>

<app-table-toolbar (search)="searchServerMangStatus($event)" (add)="addServerMangStatus()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Server Management Status Name</th>

                <th>Server Management Status Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(serverMangStatus of tableData; track serverMangStatus.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{serverMangStatus.name}}</td>

                <td>{{serverMangStatus.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editServerMangStatusStatus(serverMangStatus.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(serverMangStatus)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Server Managemnt Status'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedServerMangStatus?.name"
    [itemCode]="selectedServerMangStatus?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteserverMangStatus()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
