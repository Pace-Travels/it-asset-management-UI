<app-page-header title="Add Cloud Subscription Service" subtitle="Create New Cloud Subscription Service" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="cloudSubsServiceForm">
        <div class="form-grid-2">
            <div class="form-group">

                <label>Cloud Subscription Service Name<span class="required">*</span></label>

                <input type="text" formControlName="name">
                <app-validation-message [control]="cloudSubsServiceForm.controls['name']"
                    label="Asset Name"></app-validation-message>
            </div>
        </div>
        <div class="form-grid-1">
            <div class="form-group">

                <label>Cloud Subscription Service Description</label>

                <textarea formControlName="description"></textarea>
            </div>
        </div>

        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">

                Cancel

            </button>

            <button type="submit" class="primary-btn" [disabled]="cloudSubsServiceForm.invalid" (click)="save()">

                Save Cloud Subscription Service

            </button>

        </div>

    </form>

</div>
