<app-page-header title="Cloud Subscription Service" buttonText="Add Cloud Subscription Service" (buttonClick)="addCloudSubsService()">
</app-page-header>

<app-table-toolbar (search)="searchCloudSubsService($event)" (add)="addCloudSubsService()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Cloud Subscription Service Name</th>

                <th>Cloud Subscription Service Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(mRechaStatus of tableData; track mRechaStatus.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{mRechaStatus.name}}</td>

                <td>{{mRechaStatus.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" title="Edit" (click)="editCloudSubsService(mRechaStatus.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(mRechaStatus)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Cloud Subscription Service'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedCloudSubsService?.name"
    [itemCode]="selectedCloudSubsService?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteCloudSubsService()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
