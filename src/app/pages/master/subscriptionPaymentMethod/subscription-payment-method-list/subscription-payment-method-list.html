<app-page-header title="Subscription Payment Method" buttonText="Add Subscription Payment Method" (buttonClick)="addSubsPaymentMethod()">
</app-page-header>

<app-table-toolbar (search)="searchSubsPaymentMethod($event)" (add)="addSubsPaymentMethod()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Subscription Payment Method Name</th>

                <th>Subscription Payment Method Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(subsPaymentMethod of tableData; track subsPaymentMethod.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{subsPaymentMethod.name}}</td>

                <td>{{subsPaymentMethod.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editSubsPaymentMethod(subsPaymentMethod.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(subsPaymentMethod)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Subscription Payment Method'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedSubsPaymentMethod?.name"
    [itemCode]="selectedSubsPaymentMethod?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteSubsPaymentMethod()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
