<app-page-header title="Role Permission" buttonText="Add Role Permission" (buttonClick)="addRolePermission()">
</app-page-header>

<app-table-toolbar (search)="searchRolePermission($event)" (add)="addRolePermission()"
    [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Role</th>

                <th>Menu</th>

                <th>Permission</th>

                <th>State</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(item of tableData; track item.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{item.role?.name || item.roleId}}</td>

                <td>{{item.menu?.name || item.menuId}}</td>

                <td>{{item.permission?.name || item.permissionId}}</td>

                <td>
                    <span [class]="item.isActive ? 'badge success' : 'badge danger'">
                        {{item.isActive ? 'Active' : 'Inactive'}}
                    </span>
                </td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editRolePermission(item.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(item)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>

    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Role Permission'"
    [message]="'Are you sure you want to permanently delete this permission mapping?'" [loading]="isDeleting"
    [confirmButtonText]="'Delete'" (confirm)="deleteRolePermission()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
