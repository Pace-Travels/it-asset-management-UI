<app-page-header title="User Permission Type" buttonText="Add User Permission Type" (buttonClick)="addUserPermissionType()">
</app-page-header>

<app-table-toolbar (search)="searchUserPermissionType($event)" (add)="addUserPermissionType()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>User Permission Type Name</th>

                <th>User Permission Type Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(uPermiType of tableData; track uPermiType.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{uPermiType.name}}</td>

                <td>{{uPermiType.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editUserPermissionType(uPermiType.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(uPermiType)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete User Permission Type'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedUserPermissionType?.name"
    [itemCode]="selectedUserPermissionType?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteUserPermissionType()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
