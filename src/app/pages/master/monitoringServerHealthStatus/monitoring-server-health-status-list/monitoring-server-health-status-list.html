<app-page-header title="Monitoring Server Health Status" buttonText="Add Monitoring Server Health Status" (buttonClick)="addMonitoringServeHlthStatus()">
</app-page-header>

<app-table-toolbar (search)="searchMonitoringServeHlthStatus($event)" (add)="addMonitoringServeHlthStatus()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Monitoring Server Health Status Name</th>

                <th>Monitoring Server Health Status Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(monitorHlthStatus of tableData; track monitorHlthStatus.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{monitorHlthStatus.name}}</td>

                <td>{{monitorHlthStatus.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" (click)="editMonitoringServeHlthStatus(monitorHlthStatus.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(monitorHlthStatus)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Monitoring Server Health Status'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedMonitoringServHlthStatus?.name"
    [itemCode]="selectedMonitoringServHlthStatus?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteMonitoringServeHlthStatus()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
