<app-page-header title="Add Vendor" subtitle="Create New Vendor Information" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="vendorForm">

        <!-- General Information Section -->
        <div class="form-section">

            <h3 class="form-section-title">
                General Information
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Vendor Code
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="vendorCode">
                    <app-validation-message [control]="vendorForm.controls['vendorCode']" label="Vendor Code">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Vendor Name
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="vendorName">
                    <app-validation-message [control]="vendorForm.controls['vendorName']" label="Vendor Name">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Contact Person
                    </label>
                    <input type="text" formControlName="contactPerson">
                    <app-validation-message [control]="vendorForm.controls['contactPerson']" label="Contact Person">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Mobile Number
                    </label>
                    <input type="text" formControlName="mobileNumber">
                    <app-validation-message [control]="vendorForm.controls['mobileNumber']" label="Mobile Number">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Email
                    </label>
                    <input type="email" formControlName="email">
                    <app-validation-message [control]="vendorForm.controls['email']" label="Email">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Website
                    </label>
                    <input type="text" formControlName="website">
                    <app-validation-message [control]="vendorForm.controls['website']" label="Website">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        GST Number
                    </label>
                    <input type="text" formControlName="gstNumber">
                    <app-validation-message [control]="vendorForm.controls['gstNumber']" label="GST Number">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        PAN Number
                    </label>
                    <input type="text" formControlName="panNumber">
                    <app-validation-message [control]="vendorForm.controls['panNumber']" label="PAN Number">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Status
                        <span class="required">*</span>
                    </label>
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                    <app-validation-message [control]="vendorForm.controls['isActive']" label="Status">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Address Information Section -->
        <div class="form-section">

            <h3 class="form-section-title">
                Address Information
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Address
                    </label>
                    <input type="text" formControlName="address">
                    <app-validation-message [control]="vendorForm.controls['address']" label="Address">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        City
                    </label>
                    <input type="text" formControlName="city">
                    <app-validation-message [control]="vendorForm.controls['city']" label="City">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        State
                    </label>
                    <input type="text" formControlName="state">
                    <app-validation-message [control]="vendorForm.controls['state']" label="State">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Country
                    </label>
                    <input type="text" formControlName="country">
                    <app-validation-message [control]="vendorForm.controls['country']" label="Country">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Postal Code
                    </label>
                    <input type="text" formControlName="postalCode">
                    <app-validation-message [control]="vendorForm.controls['postalCode']" label="Postal Code">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Remarks
                    </label>
                    <input type="text" formControlName="remarks">
                    <app-validation-message [control]="vendorForm.controls['remarks']" label="Remarks">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <!-- Form Actions -->
        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">
                Cancel
            </button>
            <button type="submit" class="primary-btn" [disabled]="vendorForm.invalid" (click)="save()">
                Save Vendor
            </button>

        </div>

    </form>

</div>
