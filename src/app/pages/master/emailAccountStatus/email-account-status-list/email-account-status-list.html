<app-page-header title="Email Account Status" buttonText="Add Email Account Status" (buttonClick)="addMailAccStatus()">
</app-page-header>

<app-table-toolbar (search)="searchMailAccStatus($event)" (add)="addMailAccStatus()" [enableFilter]="false"></app-table-toolbar>

<div class="card">

    <table class="table">

        <thead>

            <tr>

                <th>#</th>

                <th>Email Account Status Name</th>

                <th>Email Account Status Description</th>

                <th>Action</th>

            </tr>

        </thead>

        <tbody>

            @for(mRechaStatus of tableData; track mRechaStatus.id; let i = $index){

            <tr>

                <td>{{i+1}}</td>

                <td>{{mRechaStatus.name}}</td>

                <td>{{mRechaStatus.description}}</td>

                <td>

                    <div class="table-actions">

                        <button class="icon-btn warning" title="Edit" (click)="editMailAccStatus(mRechaStatus.id)">

                            <i class="pi pi-pencil"></i>

                        </button>

                        <button type="button" class="icon-btn danger" title="Delete" (click)="openDeleteDialog(mRechaStatus)">

                            <i class="pi pi-trash"></i>

                        </button>

                    </div>

                </td>

            </tr>

            }

        </tbody>

    </table>
    @if(tableData.length === 0){

    <app-empty-state></app-empty-state>

    }

    <app-pagination [pageNumber]="pageNumber" [pageSize]="pageSize" [totalPages]="totalPages"
        [totalRecords]="totalRecords" (pageChange)="onPageChange($event)" (pageSizeChange)="onPageSizeChange($event)">
    </app-pagination>

</div>

<app-confirmation-dialog [(visible)]="showDeleteDialog" [title]="'Delete Email Account Status'"
    [message]="'Are you sure you want to permanently delete'" [itemName]="selectedMailAccStatus?.name"
    [itemCode]="selectedMailAccStatus?.description" [loading]="isDeleting" [confirmButtonText]="'Delete'"
    (confirm)="deleteMailAccStatus()" (cancel)="closeDeleteDialog()">

</app-confirmation-dialog>
