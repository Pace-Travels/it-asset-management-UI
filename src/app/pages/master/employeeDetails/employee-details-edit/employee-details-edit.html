<app-page-header title="Edit Employee" subtitle="Update Employee Information" [showButton]="false" [showBackButton]="true"
    (backClick)="goBack()">
</app-page-header>

<div class="card">

    <form [formGroup]="employeeForm">

        <div class="form-section">

            <h3 class="form-section-title">
                General Information
            </h3>

            <div class="form-grid-3">

                <div class="form-group">
                    <label>
                        Employee Code
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="employeeCode">
                    <app-validation-message [control]="employeeForm.controls['employeeCode']" label="Employee Code">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Employee ID
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="employeeId">
                    <app-validation-message [control]="employeeForm.controls['employeeId']" label="Employee ID">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Employee Name
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="employeeName">
                    <app-validation-message [control]="employeeForm.controls['employeeName']" label="Employee Name">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Department
                        <span class="required">*</span>
                    </label>
                    <select formControlName="departmentId">
                        <option [ngValue]="null">Select Department</option>
                        <option *ngFor="let dept of departments" [value]="dept.id">
                            {{ dept.name }}
                        </option>
                    </select>
                    <app-validation-message [control]="employeeForm.controls['departmentId']" label="Department">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Designation
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="designation">
                    <app-validation-message [control]="employeeForm.controls['designation']" label="Designation">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Email
                        <span class="required">*</span>
                    </label>
                    <input type="email" formControlName="email">
                    <app-validation-message [control]="employeeForm.controls['email']" label="Email">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Mobile Number
                        <span class="required">*</span>
                    </label>
                    <input type="text" formControlName="mobileNumber">
                    <app-validation-message [control]="employeeForm.controls['mobileNumber']" label="Mobile Number">
                    </app-validation-message>
                </div>

                <div class="form-group">
                    <label>
                        Status
                        <span class="required">*</span>
                    </label>
                    <select formControlName="isActive">
                        <option [ngValue]="true">Active</option>
                        <option [ngValue]="false">Inactive</option>
                    </select>
                    <app-validation-message [control]="employeeForm.controls['isActive']" label="Status">
                    </app-validation-message>
                </div>

            </div>

        </div>

        <div class="form-actions">

            <button type="button" class="secondary-btn" (click)="goBack()">
                Cancel
            </button>
            <button type="submit" class="primary-btn" [disabled]="employeeForm.invalid" (click)="update()">
                Update Employee
            </button>

        </div>

    </form>

</div>
